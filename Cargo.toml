[package]
name = "portgraph"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local port topology scanner and MCP server for dev stacks"
authors = ["Augusto Cerrutti <augustocerruttisatto@gmail.com>"]
repository = "https://github.com/kanchingyg/portgraph"
readme = "README.md"

[[bin]]
name = "portgraph"
path = "src/main.rs"

[lib]
name = "portgraph"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
